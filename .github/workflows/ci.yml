name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Gradle Clean Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # Swing view tests need a display, so run the build under a virtual one.
      - name: Run Gradle clean build
        run: xvfb-run --auto-servernum ./gradlew clean build

      - name: Upload test and Checkstyle reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            build/reports/tests/
            build/reports/checkstyle/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: connect-four
          path: |
            build/libs/connect-four.jar
            build/distributions/
          retention-days: 14
