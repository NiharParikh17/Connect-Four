name: Pages

# Publishes web/ to GitHub Pages: https://connectfour.nhparikh.com/
# The site also serves connect-four.jar built from the same commit, so game
# changes redeploy the site too.
on:
  push:
    branches:
      - main
    paths:
      - web/**
      - src/main/**
      - build.gradle
      - settings.gradle
      - gradle/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # Tests and Checkstyle already run in the CI workflow.
      - name: Build the game JAR
        run: ./gradlew jar

      - name: Assemble the site
        run: |
          mkdir _site
          cp -r web/. _site/
          cp build/libs/connect-four.jar _site/connect-four.jar

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
