name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Check tag matches project version
        run: |
          project_version=$(./gradlew -q properties --property version | awk '/^version:/ {print $2}')
          if [ "v${project_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match version ${project_version} in build.gradle"
            exit 1
          fi

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # Swing view tests need a display, so run the build under a virtual one.
      - name: Run Gradle clean build
        run: xvfb-run --auto-servernum ./gradlew clean build

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            build/libs/connect-four.jar \
            build/distributions/*.zip \
            build/distributions/*.tar \
            --title "Connect Four ${GITHUB_REF_NAME}" \
            --generate-notes
